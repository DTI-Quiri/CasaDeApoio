<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Brasao-Quirinopolis.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Apoio - Quirinópolis</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('casaapoio.theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      netlify-drawer,
      #netlify-drawer,
      .netlify-badge,
      [data-netlify-badge],
      [data-netlify-drawer],
      [class*="netlify-badge"],
      [id*="netlify-badge"],
      iframe[title*="Netlify" i],
      iframe[src*="netlify" i],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body class="h-full antialiased font-sans selection:bg-brand-500/20 selection:text-brand-600">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
